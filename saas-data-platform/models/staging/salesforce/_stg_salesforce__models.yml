version: 2

models:
  - name: stg_salesforce__accounts
    description: Cleaned Salesforce accounts — one row per account with firmographics and segmentation.
    columns:
      - name: account_id
        description: Primary key — Salesforce account id.
        data_tests: [unique, not_null]
      - name: owner_id
        description: Owning rep (FK to users).
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__users')
                field: user_id

  - name: stg_salesforce__users
    description: Cleaned Salesforce users (sales reps).
    columns:
      - name: user_id
        description: Primary key — Salesforce user id.
        data_tests: [unique, not_null]
      - name: user_name
        description: The rep's name.
        config: {meta: {sensitivity: pii, category: identity}}

  - name: stg_salesforce__products
    description: Cleaned product catalog with hierarchy and recurring flag.
    columns:
      - name: product_id
        description: Primary key — product id / SKU.
        data_tests: [unique, not_null]
      - name: is_recurring
        description: True for ARR-eligible subscription products.
        data_tests: [not_null]

  - name: stg_salesforce__opportunities
    description: Cleaned opportunities — open pipeline and closed (won/lost) deals.
    columns:
      - name: opportunity_id
        description: Primary key — opportunity id.
        data_tests: [unique, not_null]
      - name: account_id
        description: FK to accounts.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__accounts')
                field: account_id
      - name: opportunity_type
        description: New Business, Expansion, Renewal, Downgrade, or Churn.
        data_tests:
          - accepted_values:
              arguments:
                values: ['New Business', 'Expansion', 'Renewal', 'Downgrade', 'Churn']
      - name: is_won
        data_tests: [not_null]
      - name: is_closed
        data_tests: [not_null]

  - name: stg_salesforce__opportunity_line_items
    description: Cleaned opportunity line items — the grain of bookings / ACV.
    columns:
      - name: opportunity_line_id
        description: Primary key — opportunity line id.
        data_tests: [unique, not_null]
      - name: opportunity_id
        description: FK to opportunities.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__opportunities')
                field: opportunity_id
      - name: product_id
        description: FK to products.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__products')
                field: product_id

  - name: stg_salesforce__contracts
    description: Cleaned contracts; external_order_ref reconciles to NetSuite.
    columns:
      - name: contract_id
        description: Primary key — contract id.
        data_tests: [unique, not_null]
      - name: account_id
        description: FK to accounts.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__accounts')
                field: account_id

  - name: stg_salesforce__subscriptions
    description: Cleaned subscription segments — the ARR source of truth.
    columns:
      - name: subscription_id
        description: Primary key — subscription segment id.
        data_tests: [unique, not_null]
      - name: account_id
        description: FK to accounts.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__accounts')
                field: account_id
      - name: product_id
        description: FK to products.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__products')
                field: product_id

  - name: stg_salesforce__quotes
    description: CPQ quotes, typed. The customer contact on each quote is personal data and stays in staging.
    columns:
      - name: quote_id
        description: Primary key — CPQ quote id.
        data_tests: [unique, not_null]
      - name: opportunity_id
        description: The opportunity this quote prices.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__opportunities')
                field: opportunity_id
      - name: quote_status
        description: Accepted (won), Rejected (lost), Presented (open) or Superseded (an earlier draft).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Accepted', 'Rejected', 'Presented', 'Superseded']
      - name: contact_name
        description: The customer's contact on the quote.
        config: {meta: {sensitivity: pii, category: identity}}
      - name: contact_email
        description: The customer contact's email.
        config: {meta: {sensitivity: pii, category: work_contact}}

  - name: stg_salesforce__quote_lines
    description: CPQ quote lines, typed.
    columns:
      - name: quote_line_id
        description: Primary key — CPQ quote line id.
        data_tests: [unique, not_null]
      - name: quote_id
        description: Parent quote.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_salesforce__quotes')
                field: quote_id

  - name: stg_salesforce__quote_approvals
    description: Discount approvals, typed. The approver is an employee, so the name is personal data.
    columns:
      - name: approval_id
        description: Primary key — approval id.
        data_tests: [unique, not_null]
      - name: quote_id
        description: The quote approved.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_salesforce__quotes')
                field: quote_id
      - name: approval_level
        description: Sales VP or CFO.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Sales VP', 'CFO']
      - name: approver_name
        description: Who approved.
        config: {meta: {sensitivity: pii, category: identity}}

  - name: stg_salesforce__price_books
    description: CPQ price books, one per region.
    columns:
      - name: price_book_id
        description: Primary key — price book id.
        data_tests: [unique, not_null]

  - name: stg_salesforce__price_book_entries
    description: List price per product, price book and year.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_book_id, product_id, effective_year]
    columns:
      - name: price_book_entry_id
        description: Primary key — price book entry id.
        data_tests: [unique, not_null]
